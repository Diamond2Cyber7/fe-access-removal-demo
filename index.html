<script>

let users = [];
let report = [];

function loadData(){
  users = [
    { name:"Jane Doe", email:"jane@example.com", hasFE:true },
    { name:"John Smith", email:"john@example.com", hasFE:false },
    { name:"Alex Carter", email:"alex@example.com", hasFE:true }
  ];

  document.getElementById("status").innerText = "✅ Demo data loaded";
}

// ✅ Improved progress animation
function simulateProgress(callback){

  let progress = 0;
  let bar = document.getElementById("progressBar");

  // Reset bar visually
  bar.style.width = "0%";
  bar.innerText = "0%";

  document.getElementById("status").innerText = "⏳ Processing users...";

  let interval = setInterval(() => {

    progress += 5; // smoother increment
    bar.style.width = progress + "%";
    bar.innerText = progress + "%";

    if(progress >= 100){
      clearInterval(interval);

      setTimeout(() => {  // ✅ small delay so user sees 100%
        callback();
      }, 300);
    }

  }, 120); // ✅ smoother animation speed
}

function runRemoval(){

  if(!users.length){
    alert("Load data first!");
    return;
  }

  document.getElementById("results").innerHTML = "";
  report = [];

  simulateProgress(() => {

    let html = "";

    users.forEach(user => {

      html += `<div class="card"><b>${user.name}</b><br>`;

      if(!user.hasFE){

        html += `<span class="status-badge badge-skip">No FE Access</span>`;
        html += `<div class="skip">⏭ Skipped</div>`;

        report.push({
          name:user.name,
          status:"No FE Access",
          action:"Skipped",
          result:"No Action Required"
        });

      } else {

        html += `<span class="status-badge badge-success">Had Access</span>`;
        html += `<div class="success">✅ Access Removed</div>`;

        report.push({
          name:user.name,
          status:"Had FE Access",
          action:"Removed",
          result:"Success"
        });
      }

      html += `</div>`;
    });

    document.getElementById("results").innerHTML = html;
    document.getElementById("status").innerText = "✅ Removal process completed";

  });
}

function exportReport(){

  if(!report.length){
    alert("Run the demo first!");
    return;
  }

  let csv = "Name,Status,Action,Result\n";

  report.forEach(r=>{
    csv += `${r.name},${r.status},${r.action},${r.result}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "fe_report.csv";
  link.click();
}

</script>
