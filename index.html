<!DOCTYPE html>
<html>
<head>
<title>FE Access Removal Demo 🚀</title>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:Arial;
  margin:20px;
}

.header {
  font-size:26px;
  font-weight:bold;
}

.card {
  background:#1e293b;
  padding:15px;
  margin:15px 0;
  border-radius:8px;
  box-shadow:0 0 10px rgba(0,0,0,0.3);
}

button {
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.primary { background:#3b82f6; color:white; }
.success { color:#22c55e; }
.skip { color:#facc15; }

.progress-container {
  width:100%;
  background:#334155;
  border-radius:8px;
  margin-top:10px;
}

.progress-bar {
  width:0%;
  height:20px;
  background:#22c55e;
  border-radius:8px;
  text-align:center;
  font-size:12px;
}

.status-badge {
  padding:4px 8px;
  border-radius:4px;
  font-size:12px;
}

.badge-success { background:#16a34a; }
.badge-skip { background:#eab308; }

</style>
</head>

<body>

<div class="header">🔐 FE Access Removal Dashboard</div>

<div class="card">
<b>Environment:</b> Test Environment<br>
<b>Status:</b> Demo Mode<br>
</div>

<button class="primary" onclick="loadData()">📂 Load Demo Data</button>
<button class="primary" onclick="runRemoval()">🚀 Run Removal</button>
<button onclick="exportReport()">📄 Export Report</button>

<p id="status"></p>

<!-- ✅ Progress Bar -->
<div class="progress-container">
  <div id="progressBar" class="progress-bar">0%</div>
</div>

<hr>

<h2>Results</h2>
<div id="results"></div>

<script>

let users = [];
let report = [];

function loadData(){
  users = [
    { name:"Jane Doe", email:"jane@example.com", hasFE:true },
    { name:"John Smith", email:"john@example.com", hasFE:false },
    { name:"Alex Carter", email:"alex@example.com", hasFE:true }
  ];

  document.getElementById("status").innerText = "✅ Demo data loaded";
}

// ✅ Fake progress animation
function simulateProgress(callback){

  let progress = 0;
  let bar = document.getElementById("progressBar");

  let interval = setInterval(() => {

    progress += 10;
    bar.style.width = progress + "%";
    bar.innerText = progress + "%";

    if(progress >= 100){
      clearInterval(interval);
      callback();
    }

  }, 200);
}

function runRemoval(){

  if(!users.length){
    alert("Load data first!");
    return;
  }

  document.getElementById("results").innerHTML = "";
  report = [];

  simulateProgress(() => {

    let html = "";

    users.forEach(user => {

      html += `<div class="card"><b>${user.name}</b><br>`;

      if(!user.hasFE){

        html += `<span class="status-badge badge-skip">No FE Access</span>`;
        html += `<div class="skip">⏭ Skipped</div>`;

        report.push({
          name:user.name,
          status:"No FE Access",
          action:"Skipped",
          result:"No Action Required"
        });

      } else {

        html += `<span class="status-badge badge-success">Had Access</span>`;
        html += `<div class="success">✅ Access Removed</div>`;

        report.push({
          name:user.name,
          status:"Had FE Access",
          action:"Removed",
          result:"Success"
        });
      }

      html += `</div>`;
    });

    document.getElementById("results").innerHTML = html;
    document.getElementById("status").innerText = "✅ Removal process completed";

  });
}

function exportReport(){

  if(!report.length){
    alert("Run the demo first!");
    return;
  }

  let csv = "Name,Status,Action,Result\n";

  report.forEach(r=>{
    csv += `${r.name},${r.status},${r.action},${r.result}\n`;
  });

  let blob = new Blob([csv], { type: "text/csv" });
  let link = document.createElement("a");

  link.href = URL.createObjectURL(blob);
  link.download = "fe_report.csv";
  link.click();
}

</script>

</body>
</html>
